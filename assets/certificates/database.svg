<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Accent glow effects -->
  <circle cx="100" cy="80" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="700" cy="420" r="160" fill="#047857" opacity="0.1" filter="url(#glow)" />

  <!-- Borders -->
  <rect x="25" y="25" width="750" height="450" rx="16" fill="none" stroke="#334155" stroke-width="2" />
  <rect x="35" y="35" width="730" height="430" rx="12" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="8 6" />

  <!-- Corner embellishments -->
  <path d="M 45 65 L 45 45 L 65 45" fill="none" stroke="#10b981" stroke-width="3" />
  <path d="M 755 65 L 755 45 L 735 45" fill="none" stroke="#10b981" stroke-width="3" />
  <path d="M 45 435 L 45 455 L 65 455" fill="none" stroke="#10b981" stroke-width="3" />
  <path d="M 755 435 L 755 455 L 735 455" fill="none" stroke="#10b981" stroke-width="3" />

  <!-- Header Badge -->
  <g transform="translate(400, 75)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="url(#accentGrad)" opacity="0.2" stroke="url(#accentGrad)" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3">SQL & RDBMS</text>
  </g>

  <!-- Organization -->
  <text x="400" y="135" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="4">DATABASE ARCHITECTURE INSTITUTE</text>

  <!-- Verification Statement -->
  <text x="400" y="170" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">THIS IS TO CERTIFY THAT</text>

  <!-- Recipient Name -->
  <text x="400" y="225" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="1">Mohamed Ayman</text>
  <line x1="280" y1="245" x2="520" y2="245" stroke="url(#accentGrad)" stroke-width="2" />

  <!-- Description -->
  <text x="400" y="280" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">HAS SUCCESSFULLY COMPLETED AND DEMONSTRATED PROFICIENCY IN</text>

  <!-- Title of Certificate -->
  <text x="400" y="325" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Database Fundamentals & Data Modeling</text>

  <!-- Category & Year -->
  <text x="400" y="360" text-anchor="middle" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="2">DATABASE SYSTEMS • 2026</text>

  <!-- Footer Elements -->
  <!-- Left: Verified Seal -->
  <g transform="translate(100, 420)">
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="url(#gold)" stroke-width="2" />
    <path d="M -6 0 L -2 5 L 7 -4" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="28" y="4" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Verified Credential</text>
  </g>

  <!-- Right: ID & Issuer -->
  <g transform="translate(700, 420)">
    <text x="0" y="4" text-anchor="end" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Official Certification • ID: MA-2026-SQL-&-RDBMS</text>
  </g>
</svg>